name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://doctor:doctor@localhost:5432/doctor_booking_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: doctor
          POSTGRES_PASSWORD: doctor
          POSTGRES_DB: doctor_booking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U doctor -d doctor_booking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # If package.json has no "packageManager" field, add: with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.prod.example .env.prod.local
      - run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Smoke test
        run: |
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:3100/health && break
            sleep 3
          done
          curl -fs http://127.0.0.1:3100/health
          test "$(curl -s http://127.0.0.1:3100/specialties)" != ""
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/docs)" = "404"
          for i in $(seq 1 15); do
            docker compose -f docker-compose.prod.yml logs worker | grep -q "worker started" && exit 0
            sleep 2
          done
          echo "worker did not start" && exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
