name: doctor-booking-prodlike

x-app: &app
  image: doctor-booking-api:prodlike
  build:
    context: .
    target: runtime
  env_file: .env.prod.local
  environment:
    NODE_ENV: production
    PORT: '3000'
    DATABASE_URL: postgresql://doctor:doctor@postgres:5432/doctor_booking
    REDIS_URL: redis://redis:6379
  init: true
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: doctor
      POSTGRES_DB: doctor_booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doctor -d doctor_booking']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: doctor-booking-migrate:prodlike
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://doctor:doctor@postgres:5432/doctor_booking
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *app
    ports:
      - '127.0.0.1:3100:3000'

  worker:
    <<: *app
    command: ['node', 'dist/worker/main.js']
    healthcheck:
      disable: true

volumes:
  pgdata:
  redisdata:
